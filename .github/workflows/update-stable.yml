name: Update Vivaldi Stable

on:
  schedule:
    # Run every day at 18:00 UTC (1 hour after snapshot check)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-vivaldi-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for updates
        id: check
        run: |
          # Fetch the directory listing from Vivaldi's archive
          echo "Fetching latest stable version..."

          # Get list of files, find the one matching the pattern, sort by version (using sort -V), tail the last one
          # Pattern: vivaldi-stable_7.9.3970.47-1_amd64.deb

          LATEST_VERSION=$(curl -s "https://repo.vivaldi.com/archive/deb/pool/main/" | \
            grep -oP 'vivaldi-stable_\d+\.\d+\.\d+\.\d+-1_amd64\.deb' | \
            sed -E 's/vivaldi-stable_([0-9.]+)-1_amd64.deb/\1/' | \
            sort -V | \
            tail -n 1)

          if [ -z "$LATEST_VERSION" ]; then
            echo "Could not find latest version."
            exit 1
          fi

          echo "Latest found: $LATEST_VERSION"

          # Get current version from vivaldi-stable.nix
          CURRENT_VERSION=$(grep -oP 'version = "\K[^"]+' vivaldi-stable.nix)
          echo "Current: $CURRENT_VERSION"

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "New version available!"
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Already up to date."
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Flake
        if: steps.check.outputs.update_needed == 'true'
        run: |
          ./update-version.sh --channel stable "${{ steps.check.outputs.version }}"

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vivaldi-stable.nix version-stable.json README.md
          git commit -m "chore: update vivaldi-stable to ${{ steps.check.outputs.version }}"
          git push
